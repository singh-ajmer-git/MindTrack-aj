version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-west-2
    ACCOUNT_ID: 524781515606
    REPOSITORY_NAME: brain-tasks
    CLUSTER_NAME: brain-cluster
    DEPLOYMENT_NAME: brain-app
    CONTAINER_NAME: brain-app

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
      - IMAGE_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPOSITORY_NAME:$IMAGE_TAG
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - echo Updating kubeconfig...
      - aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $CLUSTER_NAME

  build:
    commands:
      - echo Building Docker image...
      - docker build -t $IMAGE_URI .
      - echo Build completed

  post_build:
    commands:
      - echo Pushing Docker image...
      - docker push $IMAGE_URI

      - echo Deploying to EKS...
      - kubectl set image deployment/$DEPLOYMENT_NAME $CONTAINER_NAME=$IMAGE_URI

      - echo Waiting for rollout...
      - kubectl rollout status deployment/$DEPLOYMENT_NAME

      - echo Deployment completed successfully
